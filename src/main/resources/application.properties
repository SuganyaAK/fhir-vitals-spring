# H2 database, saved to a local file so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/fhirvitals
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically creates/updates database tables to match your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Lets you view the database in a browser at /h2-console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080